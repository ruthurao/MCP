[project]
name = "mcp-agent"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["server", "client", "store", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
